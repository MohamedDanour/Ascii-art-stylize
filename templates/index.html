<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Turn your text into ASCII art banners.">
    <title>ASCII Art Web</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <main class="card">
        <header class="page-header">
            <div class="logo" aria-hidden="true">A_</div>
            <h1>ASCII Art Web</h1>
            <p class="subtitle">Type some text, pick a font, and turn it into ASCII art.</p>
        </header>

        <form id="art-form" method="post" action="/ascii-art">
            <div class="field">
                <label for="input">Your text</label>
                <textarea name="theInput" id="input" rows="3" placeholder="Hello" aria-describedby="hint counter error">
{{ .Text }}</textarea>
                <div class="field-meta">
                    <span id="hint">Enter adds a new line · Ctrl/⌘ + Enter draws</span>
                    <span id="counter" aria-live="polite">0 characters</span>
                </div>
                <p id="error" class="error" role="alert">{{ .Error }}</p>
            </div>

            <fieldset class="fonts">
                <legend>Font</legend>
                <label class="font-option">
                    <input type="radio" name="banner" value="standard.txt" {{ if or (eq .Banner "standard.txt") (eq .Banner "") }}checked{{ end }}>
                    <span>Standard</span>
                </label>
                <label class="font-option">
                    <input type="radio" name="banner" value="shadow.txt" {{ if eq .Banner "shadow.txt" }}checked{{ end }}>
                    <span>Shadow</span>
                </label>
                <label class="font-option">
                    <input type="radio" name="banner" value="thinkertoy.txt" {{ if eq .Banner "thinkertoy.txt" }}checked{{ end }}>
                    <span>Thinkertoy</span>
                </label>
            </fieldset>

            <div class="buttons">
                <button type="submit" id="draw" class="btn btn-primary">Draw</button>
                <button type="submit" id="download" class="btn btn-secondary" formaction="/download">Download .txt</button>
            </div>
        </form>

        <section class="result" aria-labelledby="result-title">
            <div class="result-header">
                <h2 id="result-title">Result</h2>
                {{ if .Result }}<button type="button" id="copy" class="btn btn-ghost">Copy</button>{{ end }}
            </div>
            {{ if .Result }}
            <textarea id="output" readonly wrap="off" rows="3" aria-label="ASCII art result">
{{ .Result }}</textarea>
            {{ else }}
            <p class="empty">Your art will appear here.</p>
            {{ end }}
        </section>
    </main>

    <script src="/static/js/script.js"></script>
</body>
</html>
